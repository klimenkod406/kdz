<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подать заявку</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .alert {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .required {
            color: #e74c3c;
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .row .form-group {
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 Новая заявка</h1>
        <p class="subtitle">Заполните форму для создания заявки</p>

        <div id="alert" class="alert"></div>

        <form id="ticketForm">
            <div class="form-group">
                <label for="employee_name">ФИО <span class="required">*</span></label>
                <input type="text" id="employee_name" name="employee_name" required placeholder="Иванов Иван Иванович">
            </div>

            <div class="row">
                <div class="form-group">
                    <label for="employee_email">Email</label>
                    <input type="email" id="employee_email" name="employee_email" placeholder="example@company.ru">
                </div>
                <div class="form-group">
                    <label for="employee_phone">Телефон</label>
                    <input type="tel" id="employee_phone" name="employee_phone" placeholder="+7 (999) 000-00-00">
                </div>
            </div>

            <div class="form-group">
                <label for="department">Отдел</label>
                <input type="text" id="department" name="department" placeholder="Например: Бухгалтерия">
            </div>

            <div class="form-group">
                <label for="priority">Приоритет</label>
                <select id="priority" name="priority">
                    <option value="low">Низкий</option>
                    <option value="normal" selected>Обычный</option>
                    <option value="high">Высокий</option>
                    <option value="critical">Критический</option>
                </select>
            </div>

            <div class="form-group">
                <label for="subject">Тема <span class="required">*</span></label>
                <input type="text" id="subject" name="subject" required placeholder="Краткое описание проблемы">
            </div>

            <div class="form-group">
                <label for="description">Описание <span class="required">*</span></label>
                <textarea id="description" name="description" required placeholder="Подробно опишите вашу проблему или запрос"></textarea>
            </div>

            <button type="submit" class="btn">Отправить заявку</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('ticketForm');
        const alert = document.getElementById('alert');

        function showAlert(message, type) {
            alert.textContent = message;
            alert.className = 'alert alert-' + type;
            alert.style.display = 'block';
            setTimeout(() => {
                alert.style.display = 'none';
            }, 5000);
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());

            try {
                const response = await fetch('/api/tickets', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    showAlert('✅ Заявка успешно отправлена! Номер: ' + result.ticket.id.substring(0, 8), 'success');
                    form.reset();
                } else {
                    showAlert('❌ Ошибка: ' + (result.error || 'Неизвестная ошибка'), 'error');
                }
            } catch (err) {
                showAlert('❌ Ошибка соединения с сервером', 'error');
            }
        });
    </script>
</body>
</html>
