<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подать заявку</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border-top: 5px solid transparent;
            border-image: linear-gradient(90deg, #1e3a5f 0%, #00b894 100%);
            border-image-slice: 1;
        }

        h1 {
            text-align: center;
            color: #1e3a5f;
            font-size: 35px;
            font-weight: 600;
        }

        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 15px;
        }

        .form-section {
            margin-bottom: 35px;
        }

        .section-title {
            color: #1e3a5f;
            margin-bottom: 20px;
            font-size: 22px;
            font-weight: 600;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        input[type="text"],
        input[type="email"],
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            font-size: 15px;
            background-color: #fff;
            transition: border-color 0.3s ease;
            font-family: inherit;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #1e3a5f;
            box-shadow: 0 0 6px 2px #3575c86f;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .required {
            color: #e74c3c;
        }

        /* Checkbox styles */
        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 13px;
        }

        .checkbox-item:hover {
            background: #e3f2fd;
            border-color: #2196f3;
        }

        .checkbox-item input[type="checkbox"] {
            display: none;
        }

        .checkbox-item .checkmark {
            width: 20px;
            height: 20px;
            border: 2px solid #ccc;
            border-radius: 4px;
            margin-right: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .checkbox-item input:checked + .checkmark {
            background: #2196f3;
            border-color: #2196f3;
        }

        .checkbox-item input:checked + .checkmark::after {
            content: '✓';
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

        .checkbox-item input:checked ~ .checkmark {
            background: #2196f3;
            border-color: #2196f3;
        }

        .checkbox-item:has(input:checked) {
            background: #e3f2fd;
            border-color: #2196f3;
            font-weight: 500;
        }

        .alert {
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .file-upload {
            border: 2px dashed #d1d5db;
            border-radius: 8px;
            padding: 25px;
            text-align: center;
            background-color: #fafafa;
            transition: border-color 0.3s ease, background-color 0.3s ease;
            cursor: pointer;
        }

        .file-upload:hover {
            border-color: #1e3a5f;
            background-color: #f0fffe;
        }

        .file-upload.dragover {
            border-color: #00b894;
            background-color: #e0fffa;
        }

        .file-upload-icon {
            font-size: 40px;
            color: #7f8c8d;
            margin-bottom: 10px;
            display: block;
        }

        .file-upload-text {
            color: #555;
            margin-bottom: 8px;
            font-size: 15px;
        }

        .file-upload-hint {
            color: #95a5a6;
            font-size: 12px;
        }

        #fileInput {
            display: none;
        }

        .file-list {
            margin-top: 15px;
            list-style: none;
        }

        .file-item {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .file-info {
            display: flex;
            align-items: center;
            flex: 1;
        }

        .file-icon {
            margin-right: 10px;
            color: #00b894;
            font-weight: bold;
            font-size: 18px;
        }

        .file-name {
            color: #333;
            word-break: break-all;
        }

        .file-size {
            color: #95a5a6;
            font-size: 12px;
            margin-left: 10px;
            white-space: nowrap;
        }

        .file-remove {
            color: #e74c3c;
            cursor: pointer;
            margin-left: 10px;
            font-weight: bold;
            border: none;
            background: none;
            font-size: 18px;
            line-height: 1;
        }

        .file-remove:hover {
            color: #c0392b;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #eee;
            border-radius: 2px;
            overflow: hidden;
            margin-top: 10px;
            display: none;
        }

        .progress-bar.active {
            display: block;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #1e3a5f 0%, #00b894 100%);
            width: 0%;
            transition: width 0.3s;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #1e3a5f;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 30px;
        }

        .btn:hover {
            background-color: #2c3e50;
        }

        .btn:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
                margin: 10px auto;
            }
            
            h1 {
                font-size: 20px;
            }

            .row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Новая заявка</h1>
        <p class="subtitle">Заполните форму для создания заявки</p>

        <div id="alert" class="alert"></div>

        <form id="ticketForm" enctype="multipart/form-data">
            <!-- Секция: Данные пользователя -->
            <div class="form-section">
                <div class="section-title">Данные пользователя</div>
                <div class="form-group">
                    <label for="employee_name">ФИО <span class="required">*</span></label>
                    <input type="text" id="employee_name" name="employee_name" required placeholder="Иванов Иван Иванович">
                </div>

                <div class="row">
                    <div class="form-group">
                        <label for="employee_email">Email <span class="required">*</span></label>
                        <input type="email" id="employee_email" name="employee_email" required placeholder="example@company.ru">
                    </div>
                    <div class="form-group">
                        <label for="department">Отдел</label>
                        <input type="text" id="department" name="department" placeholder="Например: Бухгалтерия">
                    </div>
                </div>
            </div>

            <!-- Секция: Проблема и решение -->
            <div class="form-section">
                <div class="section-title">Проблема и решение</div>
                <div class="form-group">
                    <label>Область <span class="required">*</span> (можно выбрать несколько)</label>
                    <div class="checkbox-group">
                        <label class="checkbox-item">
                            <input type="checkbox" name="areas" value="quality">
                            <span class="checkmark"></span>
                            Качество продукта
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" name="areas" value="cost">
                            <span class="checkmark"></span>
                            Стоимость
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" name="areas" value="sales">
                            <span class="checkmark"></span>
                            Увеличение продаж
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" name="areas" value="disorder">
                            <span class="checkmark"></span>
                            Беспорядок
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" name="areas" value="health">
                            <span class="checkmark"></span>
                            Здоровье и безопасность
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" name="areas" value="productivity">
                            <span class="checkmark"></span>
                            Производительность
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" name="areas" value="overstock">
                            <span class="checkmark"></span>
                            Чрезмерные запасы
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" name="areas" value="environment">
                            <span class="checkmark"></span>
                            Окружающая среда
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" name="areas" value="other" id="areaOther">
                            <span class="checkmark"></span>
                            Другое
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="problem">Проблема <span class="required">*</span></label>
                    <textarea id="problem" name="problem" required placeholder="Опишите проблему" style="min-height: 100px;"></textarea>
                </div>

                <div class="form-group">
                    <label for="solution">Предположительное решение <span class="required">*</span></label>
                    <textarea id="solution" name="solution" required placeholder="Предложите решение или укажите 'нет'" style="min-height: 80px;"></textarea>
                </div>
            </div>

            <!-- Секция: Вложения -->
            <div class="form-section">
                <div class="section-title">Вложения</div>
                <div class="form-group">
                    <label>Вложения (фото, видео, документы)</label>
                    <div class="file-upload" id="fileUploadZone">
                        <div class="file-upload-icon">📎</div>
                        <div class="file-upload-text">Перетащите файлы сюда или кликните для выбора</div>
                        <div class="file-upload-hint">
                            Разрешены: изображения, документы (PDF, Word, Excel), видео, архивы<br>
                            Максимум 10 файлов, до 50MB каждый
                        </div>
                    </div>
                    <input type="file" id="fileInput" name="files" multiple accept="image/*,video/*,.pdf,.doc,.docx,.xls,.xlsx,.txt,.csv,.zip,.rar,.7z">
                    <div class="file-list" id="fileList"></div>
                    <div class="progress-bar" id="progressBar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn" id="submitBtn">Отправить заявку</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('ticketForm');
        const alert = document.getElementById('alert');
        const fileUploadZone = document.getElementById('fileUploadZone');
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const submitBtn = document.getElementById('submitBtn');

        let selectedFiles = [];

        // Логика чекбокса "Другое"
        const areaOther = document.getElementById('areaOther');
        const allAreaCheckboxes = document.querySelectorAll('input[name="areas"]');

        areaOther.addEventListener('change', function() {
            if (this.checked) {
                // При выборе "Другое" - снимаем все остальные и отключаем
                allAreaCheckboxes.forEach(cb => {
                    if (cb !== this) {
                        cb.checked = false;
                        cb.disabled = true;
                        cb.closest('.checkbox-item').style.opacity = '0.5';
                        cb.closest('.checkbox-item').style.cursor = 'not-allowed';
                    }
                });
            } else {
                // При снятии "Другое" - включаем все обратно
                allAreaCheckboxes.forEach(cb => {
                    if (cb !== this) {
                        cb.disabled = false;
                        cb.closest('.checkbox-item').style.opacity = '1';
                        cb.closest('.checkbox-item').style.cursor = 'pointer';
                    }
                });
            }
        });

        // При выборе любого другого чекбокса - снимаем "Другое"
        allAreaCheckboxes.forEach(cb => {
            if (cb !== areaOther) {
                cb.addEventListener('change', function() {
                    if (this.checked && areaOther.checked) {
                        areaOther.checked = false;
                        // Включаем все чекбоксы обратно
                        allAreaCheckboxes.forEach(checkbox => {
                            if (checkbox !== areaOther) {
                                checkbox.disabled = false;
                                checkbox.closest('.checkbox-item').style.opacity = '1';
                                checkbox.closest('.checkbox-item').style.cursor = 'pointer';
                            }
                        });
                    }
                });
            }
        });

        // Иконки для типов файлов
        function getFileIcon(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            const imageExts = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp', 'tiff'];
            const videoExts = ['mp4', 'webm', 'mov', 'avi'];
            const docExts = ['pdf', 'doc', 'docx', 'xls', 'xlsx'];

            if (imageExts.includes(ext)) return '🖼️';
            if (videoExts.includes(ext)) return '🎬';
            if (docExts.includes(ext)) return '📄';
            if (ext === 'zip' || ext === 'rar' || ext === '7z') return '📦';
            if (ext === 'txt' || ext === 'csv') return '📝';
            return '📎';
        }

        // Форматирование размера файла
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        // Обновление списка файлов
        function updateFileList() {
            fileList.innerHTML = selectedFiles.map((file, index) => `
                <div class="file-item">
                    <div class="file-info">
                        <span class="file-icon">${getFileIcon(file.name)}</span>
                        <div>
                            <div class="file-name">${file.name}</div>
                            <div class="file-size">${formatFileSize(file.size)}</div>
                        </div>
                    </div>
                    <button type="button" class="file-remove" onclick="removeFile(${index})">×</button>
                </div>
            `).join('');
        }

        // Добавление файлов
        function addFiles(files) {
            const maxFiles = 10;
            const maxSize = 50 * 1024 * 1024; // 50MB

            for (const file of files) {
                if (selectedFiles.length >= maxFiles) {
                    showAlert('⚠️ Максимум 10 файлов', 'error');
                    break;
                }
                if (file.size > maxSize) {
                    showAlert(`⚠️ Файл "${file.name}" слишком большой (максимум 50MB)`, 'error');
                    continue;
                }
                selectedFiles.push(file);
            }
            updateFileList();
        }

        // Удаление файла
        function removeFile(index) {
            selectedFiles.splice(index, 1);
            updateFileList();
        }

        // Drag & Drop
        fileUploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            fileUploadZone.classList.add('dragover');
        });

        fileUploadZone.addEventListener('dragleave', () => {
            fileUploadZone.classList.remove('dragover');
        });

        fileUploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            fileUploadZone.classList.remove('dragover');
            addFiles(e.dataTransfer.files);
        });

        fileUploadZone.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            addFiles(e.target.files);
            fileInput.value = ''; // Сброс для возможности выбора тех же файлов
        });

        function showAlert(message, type) {
            alert.textContent = message;
            alert.className = 'alert alert-' + type;
            alert.style.display = 'block';
            setTimeout(() => {
                alert.style.display = 'none';
            }, 5000);
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (selectedFiles.length === 0) {
                // Отправка без файлов
                submitForm();
            } else {
                // Отправка с файлами через FormData
                submitFormWithFiles();
            }
        });

        async function submitForm() {
            // Собираем выбранные области
            const selectedAreas = [];
            document.querySelectorAll('input[name="areas"]:checked').forEach(cb => {
                selectedAreas.push(cb.value);
            });

            const data = {
                employee_name: document.getElementById('employee_name').value,
                employee_email: document.getElementById('employee_email').value,
                department: document.getElementById('department').value,
                areas: selectedAreas,  // Массив областей
                problem: document.getElementById('problem').value,
                solution: document.getElementById('solution').value
            };

            try {
                const response = await fetch('/api/tickets', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    showAlert('✅ Заявка успешно отправлена! Номер: ' + result.ticket.id.substring(0, 8), 'success');
                    form.reset();
                    selectedFiles = [];
                    updateFileList();
                } else {
                    showAlert('❌ Ошибка: ' + (result.error || 'Неизвестная ошибка'), 'error');
                }
            } catch (err) {
                showAlert('❌ Ошибка соединения с сервером', 'error');
            }
        }

        async function submitFormWithFiles() {
            const formData = new FormData();

            // Собираем выбранные области
            const selectedAreas = [];
            document.querySelectorAll('input[name="areas"]:checked').forEach(cb => {
                selectedAreas.push(cb.value);
            });

            // Добавляем текстовые поля
            formData.append('employee_name', document.getElementById('employee_name').value);
            formData.append('employee_email', document.getElementById('employee_email').value);
            formData.append('department', document.getElementById('department').value);
            formData.append('areas', JSON.stringify(selectedAreas));  // JSON массив
            formData.append('problem', document.getElementById('problem').value);
            formData.append('solution', document.getElementById('solution').value);

            // Добавляем файлы
            for (const file of selectedFiles) {
                formData.append('files', file);
            }

            try {
                submitBtn.disabled = true;
                submitBtn.textContent = 'Отправка...';
                progressBar.classList.add('active');
                progressFill.style.width = '0%';

                const xhr = new XMLHttpRequest();

                xhr.upload.addEventListener('progress', (e) => {
                    if (e.lengthComputable) {
                        const percent = Math.round((e.loaded / e.total) * 100);
                        progressFill.style.width = percent + '%';
                    }
                });

                xhr.addEventListener('load', () => {
                    progressBar.classList.remove('active');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Отправить заявку';

                    if (xhr.status === 201) {
                        const result = JSON.parse(xhr.responseText);
                        if (result.success) {
                            showAlert('✅ Заявка успешно отправлена! Номер: ' + result.ticket.id.substring(0, 8), 'success');
                            form.reset();
                            selectedFiles = [];
                            updateFileList();
                        } else {
                            showAlert('❌ Ошибка: ' + (result.error || 'Неизвестная ошибка'), 'error');
                        }
                    } else {
                        try {
                            const result = JSON.parse(xhr.responseText);
                            showAlert('❌ Ошибка: ' + (result.error || 'Неизвестная ошибка'), 'error');
                        } catch {
                            showAlert('❌ Ошибка сервера', 'error');
                        }
                    }
                });

                xhr.addEventListener('error', () => {
                    progressBar.classList.remove('active');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Отправить заявку';
                    showAlert('❌ Ошибка соединения с сервером', 'error');
                });

                xhr.open('POST', '/api/tickets');
                xhr.send(formData);

            } catch (err) {
                progressBar.classList.remove('active');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Отправить заявку';
                showAlert('❌ Ошибка: ' + err.message, 'error');
            }
        }
    </script>
</body>
</html>
